
name: Publish WinAurex Suite

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish to NPM Registry
        required: true
        type: boolean
        default: true

      publish_pypi:
        description: Publish to PyPI
        required: true
        type: boolean
        default: true

      publish_choco:
        description: Publish to Chocolatey
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish-pypi:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.publish_pypi

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build

      - name: Build Python distributions
        run: |
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-npm:
    name: Publish to NPM Registry
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.publish_npm

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org/

      - name: Verify package configuration
        run: |
          npm pkg get name version

      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-chocolatey:
    name: Build and Publish to Chocolatey
    runs-on: windows-latest
    if: github.event_name != 'workflow_dispatch' || inputs.publish_choco

    permissions:
      contents: read

    env:
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Chocolatey
        shell: pwsh
        run: |
          choco --version

      - name: Build Chocolatey package
        shell: pwsh
        run: |
          if (-not (Test-Path ".\chocolatey\build-package.ps1")) {
            throw "Chocolatey build script not found."
          }

          .\chocolatey\build-package.ps1

      - name: Locate Chocolatey package
        id: package
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path .\chocolatey -Filter *.nupkg -Recurse |
            Select-Object -First 1

          if (-not $pkg) {
            throw "No Chocolatey .nupkg package was generated."
          }

          "package_path=$($pkg.FullName)" >> $env:GITHUB_OUTPUT

      - name: Register Chocolatey API key
        if: env.CHOCO_API_KEY != ''
        shell: pwsh
        run: |
          choco apikey --key "$env:CHOCO_API_KEY" --source https://push.chocolatey.org/

      - name: Publish to Chocolatey Community Repository
        if: env.CHOCO_API_KEY != ''
        shell: pwsh
        run: |
          choco push "${{ steps.package.outputs.package_path }}" `
            --source https://push.chocolatey.org/

      - name: Skip Chocolatey publishing when API key is missing
        if: env.CHOCO_API_KEY == ''
        shell: pwsh
        run: |
          Write-Host "Chocolatey publishing skipped: API key is not configured."
