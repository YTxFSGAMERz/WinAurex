name: Publish WinAurex Suite

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish to NPM Registry'
        required: true
        type: boolean
        default: true
      publish_pypi:
        description: 'Publish to PyPI'
        required: true
        type: boolean
        default: true
      publish_choco:
        description: 'Publish to Chocolatey'
        required: true
        type: boolean
        default: true

jobs:
  publish-pypi:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.publish_pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Build sdist and wheel
        run: |
          python setup.py sdist bdist_wheel

      - name: Publish to PyPI (Trusted Publishing / Token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.publish_npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM Registry
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

  publish-chocolatey:
    name: Build & Publish to Chocolatey
    runs-on: windows-latest
    if: github.event_name != 'workflow_dispatch' || inputs.publish_choco
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Chocolatey Package
        shell: pwsh
        run: |
          .\chocolatey\build-package.ps1

      - name: Register Chocolatey API Key
        shell: pwsh
        if: env.CHOCO_KEY != ''
        env:
          CHOCO_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          choco apikey --key $env:CHOCO_KEY --source https://push.chocolatey.org/

      - name: Push to Chocolatey Community Repository
        shell: pwsh
        if: env.CHOCO_KEY != ''
        env:
          CHOCO_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $pkg = Get-ChildItem -Path .\chocolatey\*.nupkg | Select-Object -First 1
          if ($pkg) {
              choco push $pkg.FullName --source https://push.chocolatey.org/
          }
        continue-on-error: true
