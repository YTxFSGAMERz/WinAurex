
name: Publish WinAurex Suite

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish to NPM Registry'
        required: true
        type: boolean
        default: true
      publish_pypi:
        description: 'Publish to PyPI'
        required: true
        type: boolean
        default: true
      publish_choco:
        description: 'Publish to Chocolatey'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish-pypi:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.publish_pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.publish_npm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Publish to NPM Registry
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-chocolatey:
    name: Build and Publish to Chocolatey
    runs-on: windows-latest
    if: github.event_name != 'workflow_dispatch' || inputs.publish_choco

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Chocolatey Package
        shell: pwsh
        run: .\chocolatey\build-package.ps1

      - name: Push to Chocolatey
        shell: pwsh
        env:
          CHOCO_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCO_KEY)) {
            throw "Chocolatey API key is missing."
          }

          choco apikey --key $env:CHOCO_KEY --source https://push.chocolatey.org/

          $pkg = Get-ChildItem -Path .\chocolatey\*.nupkg |
            Select-Object -First 1

          if (-not $pkg) {
            throw "Chocolatey package not found."
          }

          choco push $pkg.FullName --source https://push.chocolatey.org/
